name: Nth Desktop Eleven build and regression
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'research/**', 'README.md', 'THIRD_PARTY_NOTICES.md']
  pull_request:
    paths-ignore: ['docs/**', 'research/**', 'README.md', 'THIRD_PARTY_NOTICES.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eleven-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check shell geometry and Nota command boundaries
        run: |
          mkdir -p build/eleven-checks
          javac -d build/eleven-checks app/src/main/java/com/nthexperience/desktop/ElevenLayout.java checks/ElevenLayoutCheck.java app/src/main/java/com/nthexperience/desktop/TenSettingsCatalog.java app/src/main/java/com/nthexperience/desktop/TenNotaActions.java checks/TenNotaActionsCheck.java
          java -cp build/eleven-checks com.nthexperience.desktop.ElevenLayoutCheck
          java -cp build/eleven-checks com.nthexperience.desktop.TenNotaActionsCheck
          python3 checks/CheckElevenIconAssets.py
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :fixture:assembleDebug :installprobe:assembleDebug --no-daemon
      - name: Check installed identity and runner
        run: python3 checks/CheckElevenManifest.py
      - uses: actions/upload-artifact@v4
        with:
          name: Nth-Desktop-Eleven-0.4.0-api-${{ matrix.api }}
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Eleven and shared engine checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.api == 30 && 'default' || 'aosp_atd' }}
          profile: pixel_2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash checks/run-eleven-checks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Eleven-evidence-api-${{ matrix.api }}
          path: |
            eleven-*.txt
            app/build/test-results/testDebugUnitTest/
            screenshots/
